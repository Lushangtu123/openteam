name: Bug Report
description: Report a bug in OpenTeam
labels: ["bug", "status:needs-repro"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in all fields so we can reproduce and fix it faster.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to trigger the bug.
      placeholder: |
        1. Open a group with members on "..."
        2. Send "..." to @everyone
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: ai_sites
    attributes:
      label: Which AI sites or models are involved?
      multiple: true
      options:
        - Gemini (gemini.google.com)
        - ChatGPT (chatgpt.com)
        - Claude (claude.ai)
        - DeepSeek (chat.deepseek.com)
        - Grok (grok.com)
        - Qwen (chat.qwen.ai)
        - Kimi (www.kimi.com)
        - An API model
        - A local agent (Claude Code, Codex…)
        - Other
    validations:
      required: true

  - type: input
    id: openteam_version
    attributes:
      label: OpenTeam version
      description: Settings > General shows it under "Check for new versions".
      placeholder: "e.g. 1.5.0"
    validations:
      required: true

  - type: input
    id: chrome_version
    attributes:
      label: Chrome version
      placeholder: "e.g. 124.0.6367.82"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 14.4, Windows 11"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics file
      description: In OpenTeam, open Settings > Data backup > Export diagnostics, then drag the downloaded file here. It holds the version, each AI site's page status, why recent replies failed and the recent logs, with no message text, names or API keys.

  - type: textarea
    id: logs
    attributes:
      label: Screenshots
      description: Attach screenshots if they help.
